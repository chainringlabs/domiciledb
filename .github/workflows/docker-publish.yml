# @spec PLATFORM-OPS-004, PLATFORM-OPS-008, PLATFORM-OPS-009
name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml
    secrets: inherit

  # This repository's own gate in front of the shared publish workflow. It
  # holds no registry or signing permission: it only builds and boots.
  smoke:
    name: Boot smoke
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the runner's Docker (single-platform image). Nothing is
      # pushed from this job. The layers go to the Actions cache, which the
      # publish job's build of the same commit then reuses.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: domiciledb:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # @spec PLATFORM-OPS-008
      # Boot the image as shipped: empty /data, no env beyond the image's own.
      # /api/health never touches the database, so the dashboard request is
      # the one that proves better-sqlite3 loads on this runtime (a builder /
      # runtime Node mismatch or a stale runtime digest fails here, not in prod).
      - name: Smoke-boot the image
        run: |
          docker run -d --name smoke -p 3000:3000 domiciledb:smoke
          deadline=$((SECONDS + 90))
          health=000; root=000
          while [ "$SECONDS" -lt "$deadline" ]; do
            health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            if [ "$health" = "200" ]; then
              root=$(curl -sL -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              if [ "$root" = "200" ]; then
                echo "smoke ok: /api/health=$health /=$root after ${SECONDS}s"
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::smoke failed after 90s: /api/health=$health /=$root"
          exit 1

      # @spec PLATFORM-OPS-009
      - name: Smoke logs and cleanup
        if: always()
        run: |
          docker logs smoke 2>&1 || true
          docker rm -f smoke >/dev/null 2>&1 || true

  # The organization's shared publish workflow: builds on pull requests
  # without pushing; otherwise pushes to GHCR, signs with cosign and attaches
  # an SPDX SBOM and build provenance. It runs only after the scan and the
  # boot smoke have passed, so a failed smoke leaves GHCR untouched.
  image:
    needs: [supply-chain, smoke]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: chainringlabs/ci/.github/workflows/docker-publish.yml@05de2072e684885be22a0185e3d712d8082a15eb # v1.1.0
