# @spec PLATFORM-OPS-003
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly absolute supply-chain scan of main. PR scans run in diff mode (only
  # vulnerabilities a PR introduces fail it), so this is what surfaces an
  # advisory that lands against already-merged dependencies.
  schedule:
    - cron: "0 13 * * 1" # Mondays 09:00 America/New_York (13:00 UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Next.js / TypeScript)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + format check (Biome)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  integration:
    name: Integration (RustFS S3 round-trip)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # RustFS: an Apache-2.0, Rust, S3-compatible store (an OSS-friendly MinIO
      # alternative). Run as a step (not a service) so it can be env-configured.
      - name: Start RustFS (S3-compatible)
        run: |
          # @spec PLATFORM-OPS-007 (gap)
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin \
            -e RUSTFS_SECRET_KEY=rustfsadmin \
            -e RUSTFS_VOLUMES=/data \
            -v rustfs-data:/data \
            rustfs/rustfs:latest

      - name: Wait for RustFS S3 endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:9000/; then
              sleep 2 && exit 0
            fi
            sleep 2
          done
          echo "RustFS did not become ready" >&2
          docker logs rustfs >&2
          exit 1

      - name: Backup/restore round-trip
        run: npm run test:integration
        env:
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_BUCKET: domiciledb-ci
          S3_ACCESS_KEY_ID: rustfsadmin
          S3_SECRET_ACCESS_KEY: rustfsadmin

      - name: Stop RustFS
        if: always()
        run: docker rm -f rustfs || true

  supply-chain:
    name: Supply chain
    permissions:
      contents: read
    uses: chainringlabs/ci/.github/workflows/supply-chain.yml@4a56829e5f1be54347d6708b0a86972e56d594ac # v1.3.0
    with:
      node-version: "26"
    secrets: inherit
